[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforgeai-ml-service"
version = "0.1.0"
description = "Python compute plane for the DataForge AI Dataset Intelligence Kernel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4,<4.10",
    "fastapi>=0.115,<0.116",
    "jsonschema>=4.22,<5.0",
    "pyarrow>=17,<22",
    "pydantic>=2.8,<3.0",
    "scikit-learn>=1.5,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "dagster>=1.13,<2.0",
    "httpx>=0.27,<0.28",
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "types-jsonschema>=4.22,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "app.api.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["app", "tools"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
